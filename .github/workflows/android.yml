name: Android

# Started by hand while the phone version is being brought up: it downloads the
# Android SDK and NDK (several gigabytes) on GitHub's machine, never locally.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      PYSIDE: "6.9.3"
      NDK: "28.2.13676358"  # r28c, what python-for-android asks for
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Android SDK pieces
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK}"
          # buildozer still looks for the old layout, tools/bin/sdkmanager.
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          ls -la "$ANDROID_HOME/tools/bin/sdkmanager"
      - name: Deployment tool and the Android wheels from Qt
        run: |
          python -m venv "$HOME/venv"
          . "$HOME/venv/bin/activate"
          pip install "pyside6==${PYSIDE}" buildozer cython
          pip install -r "$HOME/venv/lib/python3.11/site-packages/PySide6/scripts/requirements-android.txt"
          mkdir -p "$HOME/wheels" && cd "$HOME/wheels"
          base=https://download.qt.io/official_releases/QtForPython
          curl -fsSLO "$base/pyside6/PySide6-${PYSIDE}-${PYSIDE}-cp311-cp311-android_aarch64.whl"
          curl -fsSLO "$base/shiboken6/shiboken6-${PYSIDE}-${PYSIDE}-cp311-cp311-android_aarch64.whl"
          ls -la
      - name: The phone app's folder
        run: python tools/android_stage.py "$HOME/phone"
      - name: Build the APK
        run: |
          . "$HOME/venv/bin/activate"
          cd "$HOME/phone"
          pyside6-android-deploy --name Maiores \
            --wheel-pyside="$HOME/wheels/PySide6-${PYSIDE}-${PYSIDE}-cp311-cp311-android_aarch64.whl" \
            --wheel-shiboken="$HOME/wheels/shiboken6-${PYSIDE}-${PYSIDE}-cp311-cp311-android_aarch64.whl" \
            --ndk-path "$ANDROID_HOME/ndk/${NDK}" --sdk-path "$ANDROID_HOME" --force --verbose
          # The deploy tool can report success after buildozer failed, so look for the file.
          find "$HOME/phone" -name "*.apk" | tee apk-list.txt
          test -s apk-list.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maiores-android
          path: |
            ~/phone/**/*.apk
            ~/phone/pysidedeploy.spec
            ~/phone/buildozer.spec
          retention-days: 3
