name: Nightly hunt

# Once a night, on GitHub's machines: a long explorer run on fresh random seeds, broken
# input, memory, every connection and action, every dialog in all 18 languages (cut-off
# text, overlaps, windows too big for a small laptop, English left in a translation), and
# the UI sweep through a hidden copy. GitHub emails the owner when it fails; the pictures
# are kept for a few days either way, for looking through.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  hunt:
    # Public repository only: there the minutes are free; the private copy would use up its 2,000.
    if: github.repository == 'shyrkhan/maiores'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0 poppler-utils xvfb xauth \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            fonts-noto-core fonts-noto-cjk
      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt
      - name: Hunt
        # Seeds change every night, so the explorer walks new paths each time.
        run: |
          first=$(( $(date +%j) * 10 ))
          python tools/check.py --first-seed "$first" --seeds 8 --steps 400 --sweep \
            --fuzz 1000 --leaks --looks --ui-sweep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-${{ github.run_number }}
          path: |
            dev-output/looks/
            dev-output/mcp-sweep/
            dev-output/explore-*/report.html
          retention-days: 5
