name: Build

# Runs only when asked or for a version tag. Mac minutes cost ten times Linux
# minutes on private repositories, so this does not run on every push.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  draft:
    # Only the public repository builds (its runners are free; the private one has a monthly
    # allowance). A version tag makes a draft release first; each build puts its installers straight
    # into it. Release files do not count toward the 500 MB of artifact storage, which
    # once filled up and stopped the 1.3.0 release.
    if: github.repository == 'shyrkhan/maiores' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft \
              --title "Maiores ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md

  build:
    needs: draft
    # Also runs when asked by hand, when there is no draft to wait for.
    if: always() && github.repository == 'shyrkhan/maiores' && needs.draft.result != 'failure' && needs.draft.result != 'cancelled'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 keeps the Linux build usable on older systems.
        os: [ubuntu-22.04, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0 poppler-utils
      - name: Install Python packages
        run: python -m pip install -r requirements-build.txt
      - name: Install Inno Setup (Windows installer maker)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build
        run: python tools/build.py
      - name: Test the finished program
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) program="dist/maiores/maiores.exe" ;;
            macOS) program="dist/maiores.app/Contents/MacOS/maiores" ;;
            *) program="dist/maiores/maiores" ;;
          esac
          python tools/self_test.py "$program"
          if [ "$RUNNER_OS" = Linux ]; then
            # On a real X display too: closing under X11 once crashed (mixed libxkbcommon).
            sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
              libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
            SELF_TEST_PLATFORM=xcb xvfb-run -a python tools/self_test.py "$program"
            if ls dist/maiores/_internal/libxkbcommon* 2>/dev/null; then echo "::error::libxkbcommon was packed"; exit 1; fi
          fi
          # The map needs HTTPS; a build without it falls back to a plain grid. Exit code 0 = has it.
          if "$program" --network-check; then echo "HTTPS for the map: yes"; else echo "::warning::HTTPS for the map: no ($?)"; fi
      - name: Install, start and uninstall the installer
        shell: bash
        run: |
          set -e
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get install -y ./dist/maiores_*_amd64.deb
              python tools/self_test.py /opt/maiores/maiores
              test -x /usr/bin/maiores && test -f /usr/share/applications/maiores.desktop
              sudo apt-get remove -y maiores
              test ! -e /opt/maiores/maiores ;;
            Windows)
              setup=$(ls dist/*setup.exe)
              "$setup" //VERYSILENT //SUPPRESSMSGBOXES //CURRENTUSER //DIR="C:\FTtest"
              python tools/self_test.py "C:/FTtest/maiores.exe"
              "C:/FTtest/unins000.exe" //VERYSILENT //SUPPRESSMSGBOXES
              sleep 5
              test ! -e "C:/FTtest/maiores.exe" ;;
            macOS)
              dmg=$(ls dist/*.dmg)
              hdiutil attach "$dmg" -mountpoint /Volumes/FTtest -nobrowse
              python tools/self_test.py "/Volumes/FTtest/Maiores.app/Contents/MacOS/maiores"
              test -L /Volumes/FTtest/Applications
              hdiutil detach /Volumes/FTtest ;;
          esac
      - name: Put the installers into the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.zip dist/*.tar.gz dist/*.deb dist/*setup.exe dist/*.dmg)
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: maiores-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*setup.exe
            dist/*.dmg
          retention-days: 3

  release:
    # All four builds worked: show the release.
    if: github.repository == 'shyrkhan/maiores' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
