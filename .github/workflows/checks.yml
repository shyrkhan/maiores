name: Checks

# Every push: the unit tests (with and without a display) and the explorer robot.
# Linux only, so it costs little; the Windows and Mac builds stay in build.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0 poppler-utils xvfb xauth \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt
      - name: Run every check
        run: python tools/check.py --seeds 6 --sweep
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: explorer-reports
          path: dev-output/
          retention-days: 3
